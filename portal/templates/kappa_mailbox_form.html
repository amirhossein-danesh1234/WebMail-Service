{% extends 'base.html' %}
{% block content %}
<section class="form-panel">
  <a href="{% url 'home' %}">بازگشت به مدیریت</a>
  <h1>صندوق جدید</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.local_part.label_tag }}
    <div class="email-address-input">
      {{ form.local_part }}<span aria-hidden="true">@kappaut.ir</span>
    </div>
    {{ form.local_part.errors }}
    <div class="form-actions"><button type="submit">ساخت صندوق</button></div>
  </form>
</section>
{% endblock %}
