# Arvan HTTPS edge -> existing HTTP origin, like the current webmail vhost.
# For DNS-only operation, issue an origin certificate BEFORE exposing HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name mail-admin.amirhossein-danesh.ir;
    absolute_redirect off;
    client_max_body_size 22m;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "private, no-store" always;
    include /etc/nginx/snippets/webmail-portal-locations.conf;
    location = /portal-admin-gate {
        internal;
        proxy_pass http://127.0.0.1:8091/staff-gate/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    # Native Stalwart admin is intentionally available only on this host.
    # It authenticates against Stalwart, independently of portal staff login.
    location / {
        include /etc/nginx/snippets/webmail-cors-headers.conf;
        auth_request /portal-admin-gate;
        error_page 401 =302 /login/?next=/;
        if ($mail_portal_proto != "https") { return 308 https://$host$request_uri; }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }
}
