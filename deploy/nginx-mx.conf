# Direct, unproxied mail hosts. Only HTTP-01 certificate challenges use HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name mx.amirhossein-danesh.ir mx.unilrn.ir mx.kappaut.ir;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/webmail-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
