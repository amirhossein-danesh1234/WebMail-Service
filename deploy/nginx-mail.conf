# Public HTTPS terminates at the existing ArvanCloud edge.
server {
    listen 80;
    listen [::]:80;
    server_name mail.amirhossein-danesh.ir mail.unilrn.ir mail.kappaut.ir;
    absolute_redirect off;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "private, no-store" always;
    location = / { return 302 /webmail/; }
    # Admin is available through an SSH tunnel to localhost:8080.
    location ~ ^/admin(?:/|$) { return 403; }
    location / {
        if ($http_x_forwarded_proto != "https") { return 308 https://$host$request_uri; }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
}
