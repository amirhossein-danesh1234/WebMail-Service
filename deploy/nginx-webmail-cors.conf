# HTTP context. JMAP advertises one canonical API origin; only our own UIs
# may use it from the other hosted webmail/admin origins.
map $http_origin $webmail_allowed_origin {
    default "";
    "https://mail.amirhossein-danesh.ir" $http_origin;
    "https://mail.kappaut.ir" $http_origin;
    "https://mail.unilrn.ir" $http_origin;
    "https://mail-admin.amirhossein-danesh.ir" $http_origin;
}
