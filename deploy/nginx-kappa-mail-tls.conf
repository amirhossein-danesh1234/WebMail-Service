server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @HOST@;
    ssl_certificate /etc/letsencrypt/live/@CERTIFICATE@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@CERTIFICATE@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 22m;
    access_log off;

    location /portal-static/ {
        alias /var/www/kappa-webmail-static/;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 95s;
    }
}
