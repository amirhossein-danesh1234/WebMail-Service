# Include inside each webmail server block after HTTPS routing is configured.
# Keep /admin denied on user hosts and keep JMAP/OAuth/Bulwark on Stalwart.
location /portal-static/ {
    alias /var/www/webmail-portal-static/;
    add_header X-Content-Type-Options nosniff always;
}
location ~ ^/(?:login|logout|invite|password|connect|boxes|manage)(?:/|$) {
    # Invitation URLs contain credentials; never put them in the access log.
    access_log off;
    if ($http_x_forwarded_proto != "https") { return 308 https://$host$request_uri; }
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 95s;
    client_max_body_size 22m;
}
location = / {
    if ($http_x_forwarded_proto != "https") { return 308 https://$host$request_uri; }
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
}
