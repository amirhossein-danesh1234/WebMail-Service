# Rendered by deploy-portal.py only for hostnames covered by the certificate.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @MAIL_HOSTS@;
    ssl_certificate /etc/letsencrypt/live/webmail-portal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webmail-portal/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    absolute_redirect off;
    client_max_body_size 22m;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "private, no-store" always;
    include /etc/nginx/snippets/webmail-portal-locations.conf;
    location ~ ^/admin(?:/|$) { return 403; }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
}
