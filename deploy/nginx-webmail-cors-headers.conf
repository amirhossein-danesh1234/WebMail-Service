proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
add_header Access-Control-Allow-Origin $webmail_allowed_origin always;
add_header Access-Control-Allow-Credentials "true" always;
add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Last-Event-ID" always;
add_header Access-Control-Expose-Headers "Content-Disposition, Content-Length" always;
add_header Vary "Origin" always;
add_header X-Content-Type-Options nosniff always;
add_header Cache-Control "private, no-store" always;
